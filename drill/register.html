<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ログイン・登録 | GLORY ACADEMY</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="style.css" />
<style>
  .reg { padding: 26px 20px 32px; text-align: center; }

  .reg-badge {
    width: 76px; height: 76px;
    margin: 6px auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(200,162,75,0.28), rgba(200,162,75,0.10) 70%, transparent 72%);
    display: flex; align-items: center; justify-content: center;
  }
  .reg-badge .disc {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(200,162,75,0.4);
  }
  .reg-badge svg { width: 28px; height: 28px; }

  .reg h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }
  .reg-lead {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.85;
    max-width: 340px;
    margin: 0 auto 22px;
  }
  .reg-lead b { color: var(--ink); font-weight: 800; }

  /* LINE button */
  .line-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    padding: 15px 18px;
    border: none;
    border-radius: 14px;
    background: #06c755;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(6,199,85,0.35);
    transition: transform 0.12s ease, filter 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .line-btn:active { transform: scale(0.98); filter: brightness(0.97); }
  .line-btn .line-mark {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: #fff;
    color: #06c755;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.02em;
    display: flex; align-items: center; justify-content: center;
    font-family: "Arial Black", Arial, sans-serif;
  }

  .reg-help {
    display: block;
    margin: 12px auto 0;
    font-size: 12.5px;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* divider */
  .reg-or {
    display: flex; align-items: center; gap: 12px;
    max-width: 400px; margin: 26px auto 16px;
    color: var(--ink-3); font-size: 12px;
  }
  .reg-or::before, .reg-or::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }

  .reg-note {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.7;
    max-width: 360px;
    margin: 0 auto 16px;
  }
  .reg-note b { color: var(--ink); font-weight: 800; }
  .reg-note .qa { color: var(--gold-deep); font-weight: 800; }

  /* ===== LINE rich menu recreation ===== */
  .richmenu {
    max-width: 400px;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
    border: 2px solid var(--gold);
    box-shadow: 0 12px 30px rgba(0,0,0,0.28);
  }
  .rm-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px;
    background: linear-gradient(180deg, #c8a24b, #b8923f);
  }
  .rm-tile {
    position: relative;
    background: #fff;
    border-radius: 10px;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    min-height: 104px;
  }
  .rm-tile.hot {
    box-shadow: 0 0 0 3px #06c755, 0 0 14px rgba(6,199,85,0.5);
  }
  .rm-tile .tag {
    position: absolute;
    top: -8px; right: -6px;
    background: #06c755;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .rm-icon { color: #1b2a4a; height: 34px; display: flex; align-items: center; }
  .rm-icon svg { width: 34px; height: 34px; }
  .rm-label {
    font-size: 13px;
    font-weight: 800;
    color: #1b2a4a;
    letter-spacing: 0.01em;
    line-height: 1.2;
    text-align: center;
  }
  .rm-sub { font-size: 9.5px; color: #5b6b86; line-height: 1.3; text-align: center; }
  .rm-badge {
    font-size: 9.5px;
    font-weight: 800;
    color: #8a6d16;
    background: #f6e6bc;
    border: 1px solid #d9be79;
    border-radius: 999px;
    padding: 1px 8px;
  }
  .rm-bottom {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #1c1c1c;
    color: #efefef;
  }
  .rm-bottom .kb {
    width: 30px; height: 24px;
    border-radius: 5px;
    border: 1.5px solid #7a7a7a;
    display: flex; align-items: center; justify-content: center;
  }
  .rm-bottom .kb svg { width: 16px; height: 16px; color: #cfcfcf; }
  .rm-bottom .menu {
    flex: 1; text-align: center; font-weight: 800; font-size: 15px; letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <a class="back" href="javascript:history.back()" aria-label="戻る">‹</a>
    <div class="title">会員登録・ログイン</div>
    <div class="qno" id="qno"></div>
  </header>

  <main class="screen" style="padding:0;">
    <div class="reg">
      <div class="reg-badge">
        <div class="disc">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="#3a2c07" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 17l5-5-5-5M15 12H3" stroke="#3a2c07" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <h1>ログインが必要です</h1>
      <p class="reg-lead"><b>答えと解説を見たい方は、下記よりLINEログインしてください</b></p>

      <a class="line-btn" id="lineBtn" href="answer.html?q=3&a=call">
        <span class="line-mark">LINE</span>
        LINE で登録・ログイン
      </a>
      <a class="reg-help" href="javascript:void(0)">LINE でうまくログインできない場合はこちら</a>

      <div class="reg-or">または</div>

      <p class="reg-note">
        <b>GLORY ACADEMY 公式LINE</b>の<span class="qa">『クイズの答え』</span>からも見れます
      </p>

      <!-- LINE リッチメニュー再現 -->
      <div class="richmenu" role="img" aria-label="GLORY ACADEMY 公式LINE リッチメニュー">
        <div class="rm-grid">
          <div class="rm-tile hot">
            <span class="tag">ここ</span>
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="10" y="9" width="20" height="27" rx="3" transform="rotate(-8 20 22)" stroke="currentColor" stroke-width="2.4"/>
                <rect x="18" y="12" width="20" height="27" rx="3" fill="#fff" stroke="currentColor" stroke-width="2.4"/>
                <path d="M28 20l4 5-4 5-4-5z" fill="currentColor"/>
              </svg>
            </span>
            <span class="rm-label">クイズの答え</span>
          </div>

          <div class="rm-tile">
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="9" y="20" width="30" height="18" rx="2" stroke="currentColor" stroke-width="2.4"/>
                <path d="M8 20h32v6H8z" stroke="currentColor" stroke-width="2.4"/>
                <path d="M24 14v24M24 14c-4-6-11-2-7 3 2 2 7 1 7-3zM24 14c4-6 11-2 7 3-2 2-7 1-7-3z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="rm-label">実力診断・特典</span>
          </div>

          <div class="rm-tile">
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M8 10h5l4 21h18l4-14H15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="19" cy="38" r="2.6" fill="currentColor"/>
                <circle cx="34" cy="38" r="2.6" fill="currentColor"/>
              </svg>
            </span>
            <span class="rm-label">プラン購入</span>
          </div>

          <div class="rm-tile">
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="13" y="9" width="20" height="26" rx="2.5" stroke="currentColor" stroke-width="2.4"/>
                <rect x="17" y="13" width="20" height="26" rx="2.5" fill="#fff" stroke="currentColor" stroke-width="2.4"/>
                <path d="M21 20h12M21 25h12M21 30h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="rm-label">プレイヤーガイド</span>
            <span class="rm-sub">※8月4日以前の購入者用</span>
          </div>

          <div class="rm-tile">
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="10" y="10" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.4"/>
                <rect x="26" y="10" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.4"/>
                <rect x="10" y="26" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.4"/>
                <rect x="26" y="26" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.4"/>
              </svg>
            </span>
            <span class="rm-label">ダッシュボード</span>
            <span class="rm-sub">※プラン購入後に利用</span>
          </div>

          <div class="rm-tile">
            <span class="rm-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M18 18v12M30 18v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <rect x="9" y="19" width="6" height="10" rx="1.6" fill="currentColor"/>
                <rect x="33" y="19" width="6" height="10" rx="1.6" fill="currentColor"/>
                <path d="M18 24h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="rm-label">ドリル</span>
            <span class="rm-badge">無料利用開放中</span>
          </div>
        </div>

        <div class="rm-bottom">
          <span class="kb">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="7" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M7 10h.01M11 10h.01M15 10h.01M8 13h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="menu">メニュー ▾</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function getParam(n){ return new URLSearchParams(location.search).get(n); }
  var qNo = parseInt(getParam("q"), 10) || 3;
  var a = getParam("a") || "call";
  document.getElementById("qno").textContent = qNo + " 問目";
  // 「LINEで登録・ログイン」→（本来は登録処理→復帰）→ 答え・解説ページへ
  document.getElementById("lineBtn").href = "answer.html?q=" + qNo + "&a=" + a;
</script>
</body>
</html>
